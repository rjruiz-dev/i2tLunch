            <main class="col-lg-10 col-md-9">
                <div class="px-2 py-4 bg-light">
                    <h2 class="mb-2">Configuración del Perfil</h2>

                    <div class="row g-4 align-items-stretch">
                        <!-- Información personal y asistencia -->
                        <div class="col-lg-8 d-flex flex-column">

                            <div class="card bg-white shadow-sm border rounded-4 mb-4">
                            <div class="card-body">
                                <h5 class="card-title mb-4 fw-semibold">Información Personal</h5>
                                <div class="row align-items-center g-3">
                                <div class="col-md-4 text-center">
                                    <div class="position-relative d-inline-block">
                                    <img
                                        id="imagePreview"
                                        src="https://placehold.co/150x150/EBF5FF/0d6efd?text=Rodrigo"
                                        class="rounded-circle border border-3 border-light shadow-sm"
                                        width="150"
                                        height="150"
                                        alt="Avatar"
                                    />
                                    <label
                                        for="imageUpload"
                                        class="position-absolute bottom-0 end-0 bg-white border rounded-circle p-2 shadow-sm"
                                        style="cursor: pointer;"
                                    >
                                        <i class="fas fa-pencil-alt text-secondary"></i>
                                    </label>
                                    <input type="file" id="imageUpload" accept=".png,.jpg,.jpeg" hidden />
                                    </div>
                                    <h5 class="mt-3 mb-0 fw-semibold">Rodrigo Ruiz</h5>
                                    <small class="text-muted">Empleado</small>
                                </div>
                                <div class="col-md-8">

                                        <input
                                        type="email"
                                        class="form-control"
                                        id="email"
                                        value="rodrigo.ruiz@i2t.com.ar"
                                        />
                                    </div>
                                    </form>
                                </div>
                                </div>
                            </div>
                            </div>

                            <!-- Días de asistencia -->
                            <div class="card bg-white shadow-sm border rounded-4 flex-grow-1">
                                <div class="card-body">
                                    <h5 class="card-title mb-3 fw-semibold">Días de Asistencia</h5>
                                    <p class="text-muted small mb-3">
                                    Selecciona los días que asistirás a la oficina. El menú solo se mostrará para los días
                                    que elijas.
                                    </p>

                                    <div class="d-flex flex-wrap gap-2">
                                        <div class="d-flex flex-wrap gap-2">
                                            <button type="button" class="btn btn-danger active rounded-pill px-3">Lunes</button>
                                            <button type="button" class="btn btn-outline-danger rounded-pill px-3">Martes</button>
                                            <button type="button" class="btn btn-danger active rounded-pill px-3">Miércoles</button>
                                            <button type="button" class="btn btn-outline-danger rounded-pill px-3">Jueves</button>
                                            <button type="button" class="btn btn-outline-danger rounded-pill px-3">Viernes</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                    <!-- Seguridad y notificaciones -->
                    <div class="col-lg-4 d-flex flex-column">

                                </form>
                            </div>
                        </div>

                        <div class="card bg-white shadow-sm border rounded-4 flex-grow-1">

                                >Recibir recordatorios por correo</label
